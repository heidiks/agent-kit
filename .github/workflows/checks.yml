name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugins:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.292
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate and test plugins, each on its claude-code-version or the default
        run: |
          for dir in plugins/*/; do
            version="$(cat "${dir}claude-code-version" 2>/dev/null || echo "${CLAUDE_CODE_VERSION}")"
            echo "::group::${dir} on Claude Code ${version}"
            if [ "${version}" = "${CLAUDE_CODE_VERSION}" ]; then
              claude plugin validate "$dir" && claude plugin test "$dir"
            else
              npx -y "@anthropic-ai/claude-code@${version}" plugin validate "$dir" && npx -y "@anthropic-ai/claude-code@${version}" plugin test "$dir"
            fi
            echo "::endgroup::"
          done

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skill script tests
        run: |
          for dir in skills/*/scripts/; do
            if ls "$dir"test_*.py >/dev/null 2>&1; then
              python3 -m unittest discover -s "$dir" -p "test_*.py" -v
            fi
          done

  band-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pr-watch images match render.py, plans.py and animate.py
        run: |
          python3 plugins/pr-watch/assets/render.py
          python3 plugins/pr-watch/assets/plans.py
          python3 plugins/pr-watch/assets/animate.py
          git diff --exit-code plugins/pr-watch/assets/
          test -z "$(git status --porcelain plugins/pr-watch/assets/)"
