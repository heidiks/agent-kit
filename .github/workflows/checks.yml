name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugins:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.292
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for dir in plugins/*/; do claude plugin validate "$dir"; done
      - name: Test plugins
        run: |
          for dir in plugins/*/; do claude plugin test "$dir"; done

  band-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pr-watch band SVGs match render.py
        run: |
          python3 plugins/pr-watch/assets/render.py
          git diff --exit-code plugins/pr-watch/assets/
